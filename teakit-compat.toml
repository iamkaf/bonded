modId = "bonded"
projectKey = "bonded-compat"

[defaults]
launcher = "gradle"
workingDirectory = "."
gradleWrapper = "./gradlew"
noDaemon = true
console = "plain"
maxWorkers = 1
configureOnDemand = false

[defaults.gradleProperties]
"bonded.withTeaKit" = "true"
"bonded.withLiteminer" = "true"

[defaults.systemProperties]
"bonded.withTeaKit" = "true"
"bonded.withLiteminer" = "true"
"teakit.enabled" = "true"
"teakit.autoWorld" = "true"
"teakit.runtimeApi.required" = "1"
"teakit.worldId" = "bonded_teakit_compat"
"teakit.worldName" = "Bonded Compatibility TeaKit"

[nodes."26.1.2-fabric"]
loader = "fabric"
minecraft = "26.1.2"
tasks = [":fabric:26.1.2:runClient"]
gameDirectory = "fabric/versions/26.1.2/runs/client"

[nodes."26.1.2-fabric".gradleProperties]
"bonded.compatFixtures" = "basic-weapons,advanced-netherite,immersive-armors,betterend,betternether"

[nodes."26.1.2-neoforge"]
loader = "neoforge"
minecraft = "26.1.2"
tasks = [":neoforge:26.1.2:runClient"]
gameDirectory = "neoforge/versions/26.1.2/run"

[nodes."26.1.2-neoforge".gradleProperties]
"bonded.compatFixtures" = "basic-weapons,advanced-netherite,immersive-armors"
