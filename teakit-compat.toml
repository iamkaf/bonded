modId = "bonded"
projectKey = "bonded-compat"

[defaults]
launcher = "gradle"
workingDirectory = "."
gradleWrapper = "./gradlew"
noDaemon = true
console = "plain"
maxWorkers = 1
configureOnDemand = false

[defaults.gradleProperties]
"bonded.withTeaKit" = "true"
"bonded.withLiteminer" = "true"

[defaults.systemProperties]
"bonded.withTeaKit" = "true"
"bonded.withLiteminer" = "true"
"teakit.enabled" = "true"
"teakit.autoWorld" = "true"
"teakit.runtimeApi.required" = "1"
"teakit.worldId" = "bonded_teakit_compat"
"teakit.worldName" = "Bonded Compatibility TeaKit"

[nodes."26.1.2-fabric"]
loader = "fabric"
minecraft = "26.1.2"
tasks = [":fabric:26.1.2:runClient"]
gameDirectory = "fabric/versions/26.1.2/runs/client"

[nodes."26.1.2-fabric".gradleProperties]
"bonded.compatFixtures" = "basic-weapons,advanced-netherite,immersive-armors,betterend,betternether,weapons-expanded"

[nodes."26.1.2-neoforge"]
loader = "neoforge"
minecraft = "26.1.2"
tasks = [":neoforge:26.1.2:runClient"]
gameDirectory = "neoforge/versions/26.1.2/run"

[nodes."26.1.2-neoforge".gradleProperties]
"bonded.compatFixtures" = "basic-weapons,advanced-netherite,immersive-armors,weapons-expanded"

[nodes."1.21.1-fabric"]
loader = "fabric"
minecraft = "1.21.1"
tasks = [":fabric:1.21.1:runClient"]
gameDirectory = "fabric/versions/1.21.1/runs/client"

# BetterEnd and BetterNether depend on BCLib, whose mixins do not apply in the 1.21.1 development runtime.
[nodes."1.21.1-fabric".gradleProperties]
"bonded.compatFixtures" = "basic-weapons,advanced-netherite,immersive-armors,weapons-expanded"

[nodes."1.21.1-neoforge"]
loader = "neoforge"
minecraft = "1.21.1"
tasks = [":neoforge:1.21.1:runClient"]
gameDirectory = "neoforge/versions/1.21.1/run"

[nodes."1.21.1-neoforge".gradleProperties]
"bonded.compatFixtures" = "basic-weapons,advanced-netherite,immersive-armors,weapons-expanded"

[nodes."1.21.1-forge"]
loader = "forge"
minecraft = "1.21.1"
tasks = [":forge:1.21.1:runClient"]
gameDirectory = "forge/versions/1.21.1/run"

[nodes."1.21.1-forge".environment]
GLFW_PLATFORM = "x11"
XDG_SESSION_TYPE = "x11"
WAYLAND_DISPLAY = ""

[nodes."1.21.1-forge".gradleProperties]
"bonded.compatFixtures" = "advanced-netherite"
"bonded.withLiteminer" = "false"

[nodes."1.21.1-forge".systemProperties]
"bonded.withLiteminer" = "false"
